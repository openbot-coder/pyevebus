[package]
name = "pyevebus"
version = "0.3.0"
edition = "2021"
description = "High-performance async event engine with Python bindings"
license = "MIT"
repository = "https://github.com/pyevebus/pyevebus"
homepage = "https://github.com/pyevebus/pyevebus"
documentation = "https://github.com/pyevebus/pyevebus#readme"

[lib]
name = "_ffi"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[build-dependencies]
pyo3-build-config = "0.23"
